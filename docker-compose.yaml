services:
  avrnpo:
    build: .
    container_name: avrnpo
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/app/pb_data
    environment:
      # PocketBase Admin (set these in production!)
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      
      # Email Service
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - FROM_EMAIL=${FROM_EMAIL}
      - FROM_NAME=${FROM_NAME}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-true}
      - CONTACT_EMAIL=${CONTACT_EMAIL}
      
      # Helcim Payment
      - HELCIM_API_TOKEN=${HELCIM_API_TOKEN}
      - HELCIM_TEST_MODE=${HELCIM_TEST_MODE:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pb_data:
