services:
  app:
    build: .
    container_name: my_go_saas_template_pb
    environment:
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY}
      HELCIM_API_TOKEN: ${HELCIM_API_TOKEN}
      PB_PORT: ${PB_PORT:-8090}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@example.com}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-password123}
    ports:
      - "8090:8090"
    volumes:
      - .:/app
      - ./pb_data:/app/pb_data
    entrypoint: []
    command: ["air", "-c", ".air.toml"]
    dns: 8.8.8.8
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pb_data: